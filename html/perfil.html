<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Garagem Organizada</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header>
    <img src="../img/Logo-Garagem Organizada.png" alt="Logo Garagem Organizada" class="logo">
    <p>Controle simples para seus veículos</p>
</header>

<div class="titulo">
    <h2>Perfil</h2>
</div>

<div class="pagina">
    <nav>
        <a href="index.html">Início</a>
        <a href="veiculos.html">Veículos</a>
        <a href="despesas.html">Despesas</a>
        <a href="manutencoes.html">Manutenções</a>
        <a href="historico.html">Histórico</a>
        <a href="perfil.html">Perfil</a>
    </nav>

    <main>
        <h2>Informações do proprietário</h2>

        <section>
            <h3>Dados pessoais</h3>

            <form>
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome"
                       placeholder="Digite seu nome">

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email"
                       placeholder="Digite seu e-mail">

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone"
                       placeholder="Digite seu telefone">

                <button type="button">Salvar alterações</button>
            </form>
        </section>

        <section>
            <h3>Sobre o sistema</h3>

            <p>
                O Garagem Organizada ajuda a organizar veículos,
                despesas e manutenções em um único lugar.
            </p>
        </section>
    </main>
</div>

<footer>
    Projeto acadêmico
</footer>

</body>
</html>
